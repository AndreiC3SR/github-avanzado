name: CD - Main

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Incrementar AppVersion
        shell: bash
        run: |
          CURRENT=$(grep -oE 'AppVersion-[0-9]+' README.md | tail -1 | cut -d'-' -f2)
          NEXT=$((CURRENT + 1))
          sed -i "s/AppVersion-$CURRENT/AppVersion-$NEXT/" README.md
          echo "Nueva versión: AppVersion-$NEXT"

      - name: Guardar nueva versión
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Incrementar AppVersion" || echo "Sin cambios"
          git push

  validate-prod:
    needs: update-version
    runs-on: self-hosted

    steps:
      - name: Validar PROD_TOKEN
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:PROD_TOKEN -ne $env:LOCAL_PROD_TOKEN) {
            Write-Error "PROD_TOKEN no coincide con LOCAL_PROD_TOKEN"
            exit 1
          }

          Write-Host "PROD_TOKEN validado correctamente"